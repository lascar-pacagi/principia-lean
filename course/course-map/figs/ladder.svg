<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 130" width="660" height="130" font-family="sans-serif">
  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#57606a"/>
    </marker>
  </defs>
  <!-- connecting arrows -->
  <g stroke="#57606a" stroke-width="1.6" marker-end="url(#ar2)">
    <line x1="104" y1="55" x2="116" y2="55"/><line x1="212" y1="55" x2="224" y2="55"/>
    <line x1="320" y1="55" x2="332" y2="55"/><line x1="428" y1="55" x2="440" y2="55"/>
    <line x1="536" y1="55" x2="548" y2="55"/>
  </g>
  <!-- 6 course boxes -->
  <g font-family="sans-serif">
    <!-- C0 -->
    <rect x="8"   y="28" width="96" height="56" rx="6" fill="#eaeef2" stroke="#57606a" stroke-width="1.4"/>
    <text x="56"  y="48" text-anchor="middle" font-size="12" font-weight="bold">C0 · Found.</text>
    <text x="56"  y="68" text-anchor="middle" font-size="10" fill="#444">first theorem</text>
    <!-- C1 -->
    <rect x="116" y="28" width="96" height="56" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/>
    <text x="164" y="48" text-anchor="middle" font-size="12" font-weight="bold">C1 · ND</text>
    <text x="164" y="68" text-anchor="middle" font-size="11" fill="#444">⊢ ⟺ ⊨</text>
    <!-- C2 -->
    <rect x="224" y="28" width="96" height="56" rx="6" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.4"/>
    <text x="272" y="48" text-anchor="middle" font-size="12" font-weight="bold">C2 · Resol.</text>
    <text x="272" y="68" text-anchor="middle" font-size="10" fill="#444">refute ⇒ unsat</text>
    <!-- C3 -->
    <rect x="332" y="28" width="96" height="56" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.4"/>
    <text x="380" y="48" text-anchor="middle" font-size="12" font-weight="bold">C3 · SAT</text>
    <text x="380" y="68" text-anchor="middle" font-size="10" fill="#444">verified UNSAT</text>
    <!-- C4 -->
    <rect x="440" y="28" width="96" height="56" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/>
    <text x="488" y="48" text-anchor="middle" font-size="12" font-weight="bold">C4 · Euclid</text>
    <text x="488" y="68" text-anchor="middle" font-size="10" fill="#444">I.1 + the gap</text>
    <!-- C5 -->
    <rect x="548" y="28" width="96" height="56" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.4"/>
    <text x="596" y="48" text-anchor="middle" font-size="12" font-weight="bold">C5 · Gödel</text>
    <text x="596" y="68" text-anchor="middle" font-size="10" fill="#444">incompleteness</text>
  </g>
  <text x="330" y="112" text-anchor="middle" font-size="11" fill="#57606a" font-style="italic">each course's keystone theorem — every one kernel-checked and axiom-audited</text>
</svg>
