<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" font-family="sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#57606a"/>
    </marker>
  </defs>
  <!-- arrows (reuse / import) -->
  <g stroke="#57606a" stroke-width="1.8" marker-end="url(#ar)" fill="none">
    <line x1="120" y1="86" x2="120" y2="138"/>            <!-- Logic -> NatDed -->
    <line x1="170" y1="86" x2="300" y2="138"/>            <!-- Logic -> Resolution -->
    <line x1="340" y1="196" x2="340" y2="238"/>           <!-- Resolution -> Sat -->
  </g>
  <!-- Logic (spine) -->
  <rect x="30" y="32" width="190" height="54" rx="6" fill="#ddf4ff" stroke="#1f6feb" stroke-width="1.6"/>
  <text x="125" y="54" text-anchor="middle" font-size="14" font-weight="bold">Logic · Course 1 core</text>
  <text x="125" y="73" text-anchor="middle" font-size="11.5" fill="#444">Form · eval · Tautology (⊨)</text>
  <!-- NatDed -->
  <rect x="30" y="140" width="190" height="56" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/>
  <text x="125" y="162" text-anchor="middle" font-size="14" font-weight="bold">NatDed · Course 1</text>
  <text x="125" y="181" text-anchor="middle" font-size="11.5" fill="#444">⊢ · soundness · completeness</text>
  <!-- Resolution -->
  <rect x="250" y="140" width="190" height="56" rx="6" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.6"/>
  <text x="345" y="162" text-anchor="middle" font-size="14" font-weight="bold">Resolution · Course 2</text>
  <text x="345" y="181" text-anchor="middle" font-size="11.5" fill="#444">CNF · resolvent · Refut</text>
  <!-- Sat -->
  <rect x="250" y="240" width="190" height="56" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6"/>
  <text x="345" y="262" text-anchor="middle" font-size="14" font-weight="bold">Sat · Course 3</text>
  <text x="345" y="281" text-anchor="middle" font-size="11.5" fill="#444">DPLL · CDCL · LRAT checker</text>
  <!-- Euclid (island) -->
  <rect x="465" y="32" width="160" height="56" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1.6"/>
  <text x="545" y="54" text-anchor="middle" font-size="14" font-weight="bold">Euclid · Course 4</text>
  <text x="545" y="73" text-anchor="middle" font-size="11" fill="#444">EuclidPlane · I.1 · SAS</text>
  <!-- Goedel (island) -->
  <rect x="465" y="140" width="160" height="56" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6"/>
  <text x="545" y="162" text-anchor="middle" font-size="14" font-weight="bold">Gödel · Course 5</text>
  <text x="545" y="181" text-anchor="middle" font-size="11" fill="#444">Diagonal · Tarski · Gödel I</text>
  <text x="545" y="214" text-anchor="middle" font-size="10.5" fill="#8250df" font-style="italic">(independent islands)</text>
