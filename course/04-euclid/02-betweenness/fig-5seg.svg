<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 290" width="580" height="290" font-family="serif">
  <!-- ===== configuration 1: a b c on a line, apex d ===== -->
  <!-- to-apex segments: a-d, b-d given (solid), c-d concluded (red dashed) -->
  <line x1="40" y1="240" x2="120" y2="95" stroke="#24292f" stroke-width="2"/>
  <line x1="140" y1="240" x2="120" y2="95" stroke="#24292f" stroke-width="2"/>
  <line x1="280" y1="240" x2="120" y2="95" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- base a-b-c (b between a and c): a-b and b-c given (solid) -->
  <line x1="40" y1="240" x2="280" y2="240" stroke="#24292f" stroke-width="2"/>
  <circle cx="40" cy="240" r="4"/><circle cx="140" cy="240" r="4"/><circle cx="280" cy="240" r="4"/>
  <circle cx="120" cy="95" r="4"/>
  <text x="30" y="262" font-size="16" font-weight="bold">a</text>
  <text x="134" y="262" font-size="16" font-weight="bold">b</text>
  <text x="276" y="262" font-size="16" font-weight="bold">c</text>
  <text x="124" y="90" font-size="16" font-weight="bold">d</text>

  <!-- ===== configuration 2: the congruent copy a' b' c' d' ===== -->
  <line x1="330" y1="240" x2="410" y2="95" stroke="#24292f" stroke-width="2"/>
  <line x1="430" y1="240" x2="410" y2="95" stroke="#24292f" stroke-width="2"/>
  <line x1="570" y1="240" x2="410" y2="95" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="330" y1="240" x2="570" y2="240" stroke="#24292f" stroke-width="2"/>
  <circle cx="330" cy="240" r="4"/><circle cx="430" cy="240" r="4"/><circle cx="570" cy="240" r="4"/>
  <circle cx="410" cy="95" r="4"/>
  <text x="320" y="262" font-size="16" font-weight="bold">a′</text>
  <text x="424" y="262" font-size="16" font-weight="bold">b′</text>
  <text x="560" y="262" font-size="16" font-weight="bold">c′</text>
  <text x="414" y="90" font-size="16" font-weight="bold">d′</text>

  <!-- legend -->
  <line x1="40" y1="22" x2="70" y2="22" stroke="#24292f" stroke-width="2"/>
  <text x="78" y="27" font-size="12.5">given congruent:  ab, bc, ad, bd</text>
  <line x1="330" y1="22" x2="360" y2="22" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="368" y="27" font-size="12.5" fill="#cf222e">forced congruent:  cd</text>
</svg>
