<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" font-family="serif">
  <!-- circle centred A through B -->
  <circle cx="190" cy="250" r="120" fill="none" stroke="#1f6feb" stroke-width="1.5"/>
  <!-- circle centred B through A -->
  <circle cx="310" cy="250" r="120" fill="none" stroke="#cf222e" stroke-width="1.5"/>
  <!-- equilateral triangle ABC -->
  <polygon points="190,250 310,250 250,146" fill="#ffd33d" fill-opacity="0.18" stroke="#24292f" stroke-width="2"/>
  <!-- the lower intersection point, the other solution -->
  <circle cx="250" cy="354" r="3.5" fill="#6e7781"/>
  <text x="262" y="360" fill="#6e7781" font-size="14" font-style="italic">C′</text>
  <!-- vertices -->
  <circle cx="190" cy="250" r="4" fill="#24292f"/>
  <circle cx="310" cy="250" r="4" fill="#24292f"/>
  <circle cx="250" cy="146" r="4" fill="#24292f"/>
  <text x="172" y="272" font-size="18" font-weight="bold">A</text>
  <text x="318" y="272" font-size="18" font-weight="bold">B</text>
  <text x="242" y="134" font-size="18" font-weight="bold">C</text>
  <!-- side labels -->
  <text x="244" y="266" font-size="13" fill="#24292f" font-style="italic">AB</text>
  <text x="198" y="196" font-size="13" fill="#1f6feb" font-style="italic">AC</text>
  <text x="290" y="196" font-size="13" fill="#cf222e" font-style="italic">BC</text>
  <text x="60" y="380" font-size="12.5" fill="#1f6feb">circle centred A, radius AB</text>
  <text x="330" y="36" font-size="12.5" fill="#cf222e">circle centred B, radius BA</text>
</svg>
